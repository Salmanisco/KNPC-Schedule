[project]
name = "knpc-schedule"
version = "2.0.0"
description = "Lightweight FastAPI + HTMX + Tailwind CSS v4 + DaisyUI v5 shift scheduler for KNPC and KOC teams with Kuwaiti official holidays."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "holidays>=0.60",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
