<input type="hidden" name="view" value="{{ view }}">
{% if not is_current_month and view == "calendar" %}
<input type="hidden" name="month" value="{{ active_month_key }}">
{% endif %}
{% if shift_filter != "all" %}
<input type="hidden" name="shift_filter" value="{{ shift_filter }}">
{% endif %}
{% if range_key == "custom" %}
<input type="hidden" name="start" value="{{ start_iso }}">
<input type="hidden" name="end" value="{{ end_iso }}">
{% endif %}
